name: Synthetic Code Review

on:
  pull_request:
    paths:
      - "src/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: synthetic-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Synthetic review
        run: echo "synthetic fixture only"
