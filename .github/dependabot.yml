version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /
      - /plugins/autodesk-fusion
      - /plugins/reviewops-auditor-benchmark
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /plugins/autodesk-fusion/native/source
    schedule:
      interval: weekly
