name: Marketplace

on:
  pull_request:
    paths:
      - ".github/workflows/marketplace.yml"
      - ".agents/plugins/**"
      - "plugins/**"
      - "scripts/validate-marketplace.mjs"
      - "scripts/run-marketplace-tests.mjs"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/marketplace.yml"
      - ".agents/plugins/**"
      - "plugins/**"
      - "scripts/validate-marketplace.mjs"
      - "scripts/run-marketplace-tests.mjs"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - run: npm --prefix plugins/reviewops-auditor-benchmark ci --ignore-scripts
      - run: npm run validate:marketplace
      - run: npm run test:marketplace
