name: ReviewOps Auditor + Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/reviewops-auditor-benchmark.yml"
      - ".agents/plugins/marketplace.json"
      - "package.json"
      - "README.md"
      - "docs/reviewops-auditor-benchmark-implementation-plan.md"
      - "plugins/reviewops-auditor-benchmark/**"
      - "scripts/*reviewops*"
      - "scripts/validate-marketplace.mjs"
      - "tests/reviewops-auditor-benchmark/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reviewops-auditor-benchmark.yml"
      - ".agents/plugins/marketplace.json"
      - "package.json"
      - "README.md"
      - "docs/reviewops-auditor-benchmark-implementation-plan.md"
      - "plugins/reviewops-auditor-benchmark/**"
      - "scripts/*reviewops*"
      - "scripts/validate-marketplace.mjs"
      - "tests/reviewops-auditor-benchmark/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewops-auditor-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Offline package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm --prefix plugins/reviewops-auditor-benchmark ci --ignore-scripts
      - run: npm run validate:marketplace
      - run: npm run test:reviewops-auditor-benchmark

  source:
    name: Reproducible source bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - run: npm --prefix plugins/reviewops-auditor-benchmark ci --ignore-scripts
      - run: npm audit --prefix plugins/reviewops-auditor-benchmark --omit=dev
      - run: npm run verify:reviewops-source

  cold-package:
    name: Cold copied package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - run: node --test --test-concurrency=1 tests/reviewops-auditor-benchmark/integration/packaged.test.mjs
