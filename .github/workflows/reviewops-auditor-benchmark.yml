name: ReviewOps Auditor + Benchmark

on:
  # Required checks must also run for documentation and governance changes.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewops-auditor-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewops-e2e:
    name: ReviewOps E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Cold copied package / Node 22.19.0
        run: node --test --test-concurrency=1 tests/reviewops-auditor-benchmark/integration/packaged.test.mjs
      - name: Install ReviewOps dependencies
        run: npm --prefix plugins/reviewops-auditor-benchmark ci --ignore-scripts
      - name: Full ReviewOps qualification / Node 22.19.0
        run: npm run test:reviewops-auditor-benchmark
      - name: Audit runtime dependencies
        run: npm audit --prefix plugins/reviewops-auditor-benchmark --omit=dev
      - name: Verify reproducible source bundle
        run: npm run verify:reviewops-source

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Full uninstrumented suite / Node 24
        run: npm --prefix plugins/reviewops-auditor-benchmark run test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Full uninstrumented suite / Node 26
        run: npm --prefix plugins/reviewops-auditor-benchmark run test
