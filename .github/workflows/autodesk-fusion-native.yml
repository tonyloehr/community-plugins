name: Autodesk Fusion native source builds

on:
  pull_request:
    paths:
      - ".github/workflows/autodesk-fusion-native.yml"
      - ".gitattributes"
      - "plugins/autodesk-fusion/native/source/**"
      - "plugins/autodesk-fusion/native/source-manifest.json"
      - "plugins/autodesk-fusion/native/community-credential-errors.patch"
      - "plugins/autodesk-fusion/scripts/build-native.mjs"
  push:
    # The implementation branch bootstraps the six reviewed candidate artifacts
    # before package admission. No workflow commits or publishes these outputs.
    branches: [main, codex/autodesk-fusion-interop]
    paths:
      - ".github/workflows/autodesk-fusion-native.yml"
      - ".gitattributes"
      - "plugins/autodesk-fusion/native/source/**"
      - "plugins/autodesk-fusion/native/source-manifest.json"
      - "plugins/autodesk-fusion/native/community-credential-errors.patch"
      - "plugins/autodesk-fusion/scripts/build-native.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autodesk-fusion-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64-gnu
            architecture: x64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            platform: linux-arm64-gnu
            architecture: arm64
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            platform: win32-x64-msvc
            architecture: x64
            target: x86_64-pc-windows-msvc
            msvc_architecture: amd64
          - runner: windows-11-arm
            platform: win32-arm64-msvc
            architecture: arm64
            target: aarch64-pc-windows-msvc
            msvc_architecture: arm64
          - runner: macos-15
            platform: darwin-arm64
            architecture: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: darwin-x64
            architecture: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      FUSION_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Install the exact Rust toolchain and target without changing defaults
        run: rustup toolchain install 1.98.0 --profile minimal --target "${{ matrix.target }}"
      - name: Build and load the pinned host module without credential access
        if: runner.os != 'Windows'
        run: node plugins/autodesk-fusion/scripts/build-native.mjs --output "$RUNNER_TEMP/fusion-native-output" --target "${{ matrix.target }}"
      - name: Select MSVC and build/load the pinned Windows host module
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'A Visual Studio C++ toolchain is required.' }
          $launcher = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          # Microsoft's documented Developer PowerShell host is amd64, including
          # its ARM64 target example. The ARM64 runner still loads with ARM64 Node.
          # https://learn.microsoft.com/visualstudio/ide/reference/command-prompt-powershell
          & $launcher -Arch '${{ matrix.msvc_architecture }}' -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VCToolsVersion -or -not $env:WindowsSDKVersion) { throw 'MSVC and Windows SDK selection did not complete.' }
          node plugins/autodesk-fusion/scripts/build-native.mjs --output "$env:RUNNER_TEMP/fusion-native-output" --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload candidate binary and source/compiler/SDK receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fusion-keyring-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/fusion-native-output/keyring.${{ matrix.platform }}.node
            ${{ runner.temp }}/fusion-native-output/keyring.${{ matrix.platform }}.build.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

# These jobs do not access OS credentials, validate a licensed Fusion kernel,
# install plugin assets, commit changes, publish a release, or claim deterministic
# binary identity across different runner images and SDK versions. Review each
# artifact and its receipt before the separate package-admission step.
