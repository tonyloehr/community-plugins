name: ${PM_GRAFANA_LIVE_PROJECT:-pm-grafana-live-10}

services:
  telemetry-seed:
    build:
      context: ./seed
      args:
        NODE_IMAGE: ${PM_GRAFANA_SEED_IMAGE:-node:22.19.0-alpine3.22}
    environment:
      PORT: "8080"
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      TEMPO_OTLP_URL: http://tempo:4318/v1/traces
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 1s
      retries: 30
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks: [observability]

  prometheus:
    image: ${PM_GRAFANA_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --no-web.enable-lifecycle
      - --no-web.enable-admin-api
      - --log.level=warn
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /prometheus:uid=65534,gid=65534,mode=0700
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    depends_on:
      telemetry-seed:
        condition: service_healthy
    networks: [observability]

  loki:
    image: ${PM_GRAFANA_LOKI_IMAGE:-grafana/loki:3.5.3}
    command: [-config.file=/etc/loki/loki.yaml]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /loki:uid=10001,gid=10001,mode=0700
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    networks: [observability]

  tempo:
    image: ${PM_GRAFANA_TEMPO_IMAGE:-grafana/tempo:2.8.2}
    command: [-config.file=/etc/tempo/tempo.yaml]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/tempo:uid=10001,gid=10001,mode=0700
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks: [observability]

  postgres:
    image: ${PM_GRAFANA_POSTGRES_IMAGE:-postgres:17.6-alpine3.22}
    environment:
      POSTGRES_DB: observability
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --auth-host=trust --auth-local=trust
    read_only: true
    user: "70:70"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0750
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-observability.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d observability"]
      interval: 2s
      timeout: 1s
      retries: 30
    networks: [observability]

  grafana:
    image: ${PM_GRAFANA_IMAGE:?runner must select a pinned matrix image}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_HTTP_PORT: "3000"
    read_only: true
    user: "472:472"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/lib/grafana:uid=472,gid=472,mode=0700
      - /var/log/grafana:uid=472,gid=472,mode=0700
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: [CMD-SHELL, "wget --spider --quiet http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 1s
      retries: 60
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [observability]

  # Docker 29 does not publish ports for an internal-only bridge. Keep every
  # real provider isolated and expose only this fixed read-route gateway.
  grafana-gateway:
    image: ${PM_GRAFANA_SEED_IMAGE:-node:22.19.0-alpine3.22}
    command: [node, /opt/gateway/gateway.mjs]
    ports:
      - "127.0.0.1:${PM_GRAFANA_LIVE_PORT:-0}:3000"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./gateway.mjs:/opt/gateway/gateway.mjs:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 1s
      retries: 30
    depends_on:
      grafana:
        condition: service_healthy
    networks: [observability, ingress]

networks:
  observability:
    internal: true
  ingress:
    driver: bridge
