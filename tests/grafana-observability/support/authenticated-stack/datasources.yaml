apiVersion: 1
deleteDatasources: []
prune: true

datasources:
  - name: Disposable Auth Prometheus
    uid: live-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 3.5.0
